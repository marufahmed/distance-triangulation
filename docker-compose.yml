version: '3.8'

services:
  stereo-vision:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    privileged: true
    # devices:
    #   - "/dev/video0:/dev/video0"
    #   - "/dev/video1:/dev/video1"
    group_add:
      - "video"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped